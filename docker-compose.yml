services:
  app:
    build: .
    container_name: mdt_app
    restart: unless-stopped
    ports:
      # MDT draait op een eigen poort naast MKAPP (die zelf poort 80
      # gebruikt). Staat MDT op een andere server dan MKAPP, dan kan dit
      # gewoon poort 80 worden -- pas dan hieronder aan.
      - "8081:80"
    environment:
      # MDT heeft GEEN eigen db-service (zoals MKAPP die wel heeft) --
      # het verbindt met de BESTAANDE, gedeelde MKAPP-database, eventueel
      # over het netwerk als MDT op een andere server draait. Zie
      # README.md voor het aanmaken van een beperkt DB-account.
      DB_HOST: "wijzig_dit_naar_mkapp_db_host"
      DB_PORT: "3306"
      DB_NAME: "mkapp"
      DB_USER: "mdt_user"
      DB_PASS: "wijzig_dit_wachtwoord"
      APP_TIMEZONE: "Europe/Amsterdam"
      # Fase M4: het publieke adres waarop MDT zelf bereikbaar is --
      # hierop gebaseerd wordt de volledige foto-URL opgebouwd die in de
      # gedeelde database komt, zodat MKAPP een geuploade foto rechtstreeks
      # bij MDT kan tonen. Pas dit aan zodra MDT een eigen domein heeft
      # (en zorg dat dat domein ook echt bereikbaar is voor wie MKAPP
      # gebruikt, niet alleen voor de crew op straat).
      APP_BASE_URL: "http://localhost:8081"
      # Fase M5: eigen VAPID-sleutelpaar voor Web Push -- genereer je
      # eigen paar met `docker compose exec app php genereer_vapid_sleutels.php`
      # (ná de eerste build) en zet het resultaat hier neer. Leeg laten
      # betekent: geen pushmeldingen versturen (de rest van MDT blijft
      # gewoon werken). Nooit hergebruiken tussen omgevingen/installaties.
      VAPID_PUBLIC_KEY: ""
      VAPID_PRIVATE_KEY: ""
      VAPID_SUBJECT: "mailto:beheer@voorbeeld.nl"
      # Gedeeld geheim dat MKAPP moet meesturen als ?token=... in de
      # webhook-URL (Beheer > Connectiviteit in MKAPP) -- zie README.md.
      WEBHOOK_TOKEN: "wijzig_dit_token"
    volumes:
      # Fase M4: geuploade foto's blijven bewaard als de container
      # herstart/opnieuw gebouwd wordt (anders verdwijnen ze bij elke
      # `docker compose up -d --build`).
      - ./data/uploads:/var/www/html/uploads
